apiVersion: 1
contactPoints:
  - orgId: 1
    name: ntfy
    receivers:
      - uid: ntfy-webhook
        type: webhook
        settings:
          url: http://ntfy/${NTFY_TOPIC}?template=grafana
          httpMethod: POST
policies:
  - orgId: 1
    receiver: ntfy
    group_by: [grafana_folder, alertname]
    group_wait: 10s
    group_interval: 1m
    repeat_interval: 4h
