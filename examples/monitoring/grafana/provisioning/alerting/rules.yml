apiVersion: 1
groups:
  - orgId: 1
    name: ai-audit
    folder: ai-audit
    interval: 1m
    rules:
      - uid: ai-audit-proxy-metrics-down
        title: "Proxy metrics unavailable"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: victoriametrics
            model:
              refId: A
              instant: true
              expr: "min(up{job=\"ai-audit\"})"
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
        noDataState: Alerting
        execErrState: Error
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "VictoriaMetrics cannot scrape the ai-audit proxy. Live dashboard values may be stale; check the proxy and scrape target."
      - uid: ai-audit-log-integrity
        title: "Audit log cannot take records"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: victoriametrics
            model:
              refId: A
              instant: true
              expr: "sum(increase(ai_audit_log_write_failures_total[5m])) + sum(increase(ai_audit_log_unavailable_total[5m]))"
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "The audit log refused or lost records in the last 5 minutes. Requests are refused with 503 until the log is repaired (run ai-audit verify)."
      - uid: ai-audit-session-index-rebuild
        title: "Session index rebuild failed"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: victoriametrics
            model:
              refId: A
              instant: true
              expr: "sum(ai_audit_session_index_rebuild_failures_total)"
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "The proxy could not rebuild its session index from the local audit log at startup. Session links may be incomplete. Run ai-audit verify and inspect proxy startup logs."
      - uid: ai-audit-injection-spike
        title: "Prompt-injection signal spike"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: victoriametrics
            model:
              refId: A
              instant: true
              expr: "sum(increase(ai_audit_injection_signals_total[10m]))"
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [5] }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "More than 5 advisory prompt-injection signals in 10 minutes. Check which rule ids fire and which keys send them."
      - uid: ai-audit-upstream-5xx
        title: "Upstream 5xx ratio above 5%"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: victoriametrics
            model:
              refId: A
              instant: true
              expr: "sum(rate(ai_audit_upstream_responses_total{class=\"5xx\"}[5m])) / clamp_min(sum(rate(ai_audit_upstream_responses_total[5m])), 1e-9)"
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.05] }
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "More than 5% of upstream responses are 5xx over 5 minutes."
      - uid: ai-audit-tool-call-held
        title: "Tool call held by the gate"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: victoriametrics
            model:
              refId: A
              instant: true
              expr: "sum(increase(ai_audit_action_gate_total{result=\"hold\"}[5m]))"
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "A proposed tool call carried a destination from untrusted content, a secret, or a tool outside the key's list. In enforce mode the client got a notice instead; in observe mode the call was delivered. Inspect actionGate in the audit log."
      - uid: ai-audit-refusal-spike
        title: "Refusal spike (401 or 403)"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: victoriametrics
            model:
              refId: A
              instant: true
              expr: "(sum(increase(ai_audit_requests_total{decision=\"none\",status=~\"401|403\"}[5m])) or vector(0)) + (sum(increase(ai_audit_refusals_suppressed_total[5m])) or vector(0))"
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [10] }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "More than 10 refused keys or models in 5 minutes. A client may be misconfigured, or someone may be guessing keys. The refusal records show route, key name and source address."
      - uid: ai-audit-budget-failures
        title: "Budget accounting failed"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: victoriametrics
            model:
              refId: A
              instant: true
              expr: "sum(increase(ai_audit_budget_failures_total[5m]))"
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "Token budget counting or settlement failed and the proxy refused generation for a budgeted key (ADR 0044). Check the budget directory and the provider count endpoint."
      - uid: ai-audit-unknown-usage
        title: "Unknown token usage rising"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: victoriametrics
            model:
              refId: A
              instant: true
              expr: "sum(increase(ai_audit_unknown_usage_total[30m])) / clamp_min(sum(increase(ai_audit_upstream_responses_total{class=\"2xx\"}[30m])), 1)"
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.2] }
        noDataState: OK
        execErrState: Error
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "More than 20% of successful calls had no provider-reported usage over 30 minutes. Token totals are a lower bound (ADR 0012). Clients may need stream_options.include_usage."
